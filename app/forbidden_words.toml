# 本地违规词表：发布、编辑商品时，在描述框下面提醒卖家。只提醒，不拦发布；拦不拦只看闲鱼的接口。
# 哪些词收、哪些不收、为什么，见 docs/forbidden-words-research.md 第三节。
# 后端（app/wordcheck.py）是唯一读它的地方，页面拿的是检查结果，改了这里不用改前端。
#
# 每条规则属于一个类别（[categories.*]），类别定默认的档位和依据，规则里可以改：
#   level：strong 强提醒 / weak 弱提醒 / info 告知
#   basis：official 官方 / law 法律 / opensource 开源 / experience 经验
#
# 规则有三种写法，三选一：
#   words = [...]           词组。不分大小写、全角半角；字中间夹了空格、点、横线这类符号也算（"微 信"、"V.X"）。
#                           以英文、数字开头或结尾的词，挨着英文、数字不算（"vx" 不命中 "dvx"，"加v" 不命中 "加vip"）
#   pattern = "..."         Python 正则，在统一成小写、半角以后的文字上匹配。号码、链接用这个
#   combo = [[...], [...]]  前一组的词后面 gap 个字以内（默认 2）跟着后一组的词才算，中间不跨句号、换行。
#                           只看单个词会误报的用这个："加" + "微信" 才算，"微信支付" 不算
# 可选：
#   label    规则的名字。正则、组合规则在页面上显示这个（必填）；词组规则显示命中的词，label 只是给人看的分组名
#   suggest  替换建议
#   exclude  命中的地方落在这些词组里面就不算（"最好" 不算 "最好自提" 里的）
#
# 原则：
# - 不扫单字（"最"、"仿"），只扫词组；常见说法里会误报的词（"第一次用"、"唯一的缺点"、"电话手表"、"100%棉"）不收；
# - 号码要有上下文："Q""加""微""V" 后面跟的号码才算 QQ 号、微信号，11 位手机号直接算；
# - 变体（威信、V❤、➕我）收进来是为了提醒卖家改成合规的说法，不是帮他换个写法躲审核；
# - 第 10 类（只有经验帖的说法）不收。

[categories.contact]
name = "站外引流"
level = "strong"
basis = "official"
note = "引导站外交易扣分最重，商品描述、私聊、主页都算。买家可以直接在闲鱼上聊，不用留别的联系方式"

[categories.fake]
name = "假货侵权"
level = "strong"
basis = "official"
note = "闲鱼对假货零容忍，写明「高仿」也算售假，会下架、封号。卖真品就写清楚在哪买的、有没有凭证"

[categories.prohibited]
name = "禁售品"
level = "strong"
basis = "official"
note = "这类东西闲鱼不让卖，看的是卖什么，不是怎么写"

[categories.virtual]
name = "虚拟商品"
level = "weak"
basis = "experience"
note = "网盘资源、共享账号、代练这类多是盗版或违规，容易被下架"

[categories.medical]
name = "医疗功效"
level = "weak"
basis = "law"
note = "普通商品不能宣称疗效；化妆品的功效用语有专门的禁用词"

[categories.absolute]
name = "极限词"
level = "weak"
basis = "law"
note = "《广告法》禁止「最佳」「国家级」这类用语；个人卖闲置算不算广告没有定论，闲鱼也没单列，换个具体说法不吃亏"

[categories.platform]
name = "其他平台"
level = "weak"
basis = "experience"
note = "写别的平台名会被提示、降权；放店铺名、链接、口令算引导站外交易"

[categories.promotion]
name = "促销"
level = "weak"
basis = "experience"

[categories.business]
name = "经营性表述"
level = "info"
basis = "official"
note = "不影响发布。2026-06-01 起，这类表述加上交易数据达标，会被认定为经营性卖家（要登记、履行七天无理由）。真在经营的按规定登记"

# ---- 1. 站外引流和联系方式 ----

[[rules]]
category = "contact"
label = "联系方式"
words = [
  "威信", "薇信", "维信", "围信", "V信", "微❤", "薇❤", "V❤", "VX", "WX", "weixin",
  "扣扣", "企鹅号", "Q号", "QQ号", "微信号", "Telegram", "TG", "电报号",
]
suggest = "删掉，买家在闲鱼上直接聊"

[[rules]]
category = "contact"
label = "加我"
# "私聊"不收：闲鱼里的聊天就叫私聊，"喜欢的私聊"是正常说法
words = [
  "加我", "+我", "➕我", "加好友", "扣我", "Q我", "加v", "加q", "加薇", "加威",
  "联系方式", "留个联系方式", "打电话", "电话联系", "手机联系", "留个电话", "留电话",
  "留个手机号", "手机号联系",
]
exclude = ["参加我", "增加我", "追加我"]
suggest = "删掉，买家在闲鱼上直接聊"

[[rules]]
category = "contact"
label = "加 + 微信 / QQ"
combo = [
  ["加", "添加", "+", "➕", "联系", "找", "私", "搜"],
  ["微信", "wx", "vx", "qq", "钉钉", "飞书", "小飞机", "电报"],
]
gap = 2
suggest = "删掉，买家在闲鱼上直接聊"

[[rules]]
category = "contact"
label = "微信 / QQ + 联系"
combo = [
  ["微信", "qq", "钉钉", "飞书"],
  ["联系", "找我", "加我", "私我", "搜", "同号"],
]
gap = 2
suggest = "删掉，买家在闲鱼上直接聊"

[[rules]]
category = "contact"
label = "私下交易"
words = [
  "支付宝转账", "走支付宝", "走微信", "微信转账", "转账",
  "线下交易", "私下交易", "不走闲鱼", "不走平台",
  "先付定金", "先交定金", "付定金", "交定金", "付押金", "交押金",
]
exclude = ["不转账", "不接受转账", "拒绝转账", "不支持转账", "不能转账", "不要转账", "别转账"]
suggest = "走闲鱼的担保交易，不提私下转账、定金"

[[rules]]
category = "contact"
label = "手机号"
pattern = '(?<!\d)1[3-9]\d(?:[ -]?\d{4}){2}(?!\d)'
suggest = "删掉号码"

[[rules]]
category = "contact"
label = "QQ 号"
# 前面要有 QQ、扣扣、企鹅；单个 Q 要跟着"号"或冒号，或者前面是"加""扣"，免得把型号（Q10000）当成 QQ 号
pattern = '(?<![a-z0-9])(?:qq|扣扣|企鹅)(?:号码?|群)?[:\s]*\d{5,12}(?![\da-z])|(?<![a-z0-9])q(?:号码?|:)\s*\d{5,12}(?![\da-z])|(?:加|扣|➕|\+)\s*q\s*\d{5,12}(?![\da-z])'
suggest = "删掉号码"

[[rules]]
category = "contact"
label = "微信号"
# 微信号 6–20 位、字母开头。跟在"微信""vx"后面的要带数字或下划线，免得把英文单词（微信 support）当成微信号；
# "加v""v:" 后面的直接算
pattern = '(?<![a-z0-9])(?:微信号?|威信|薇信|维信|v信|vx|wx|weixin|v❤|微❤)\s*号?[:\s]*[a-z](?=[-_a-z]*[\d_])[-_a-z0-9]{5,19}(?![-_a-z0-9])|(?:加|➕|\+)\s*v\s*:?\s*[a-z0-9][-_a-z0-9]{5,19}(?![-_a-z0-9])|(?<![a-z0-9])v:\s*[a-z0-9][-_a-z0-9]{5,19}(?![-_a-z0-9])'
suggest = "删掉微信号"

[[rules]]
category = "contact"
label = "链接"
pattern = '(?:https?://|www\.)[^\s，。]+|(?<![a-z0-9.\-])(?:[a-z0-9-]+\.)+(?:com|cn|net|top|cc|vip)(?![a-z0-9])'
suggest = "删掉链接"

# ---- 2. 假货和侵权 ----

[[rules]]
category = "fake"
label = "仿品"
words = ["高仿", "A货", "超A", "精仿", "仿品", "仿货", "原单", "莆田鞋", "莆田货", "莆田版", "纯原", "一比一"]

[[rules]]
category = "fake"
label = "1:1"
pattern = '1\s*[:比]\s*1\s*(?:复刻|还原|原版|做工|品质|正品|高仿)'

[[rules]]
category = "fake"
label = "复刻、尾单"
level = "weak"
basis = "experience"
words = ["复刻", "尾单"]
exclude = ["官方复刻", "正版复刻", "官方正版复刻"]

[[rules]]
category = "fake"
label = "擦边品牌"
# 2026-06 澎湃的报道：商家用"同款""小众平替""混背"擦边，律师说可能构成商标侵权。"同款"单用太常见，只收"大牌同款"
level = "weak"
basis = "law"
words = ["大牌同款", "小众平替", "平替", "混背"]

# ---- 3. 禁售品：只收不会误报的词组 ----
# 不收"气枪"（打气枪、吹气枪）、"外挂"（外挂式）、"大麻"单用（大麻绳）、"身份证"单用（身份证卡套）

[[rules]]
category = "prohibited"
label = "武器"
words = ["仿真枪", "火药枪", "弓弩", "管制刀具", "电击器", "电击棒", "甩棍"]

[[rules]]
category = "prohibited"
label = "毒品、药物"
words = ["冰毒", "摇头丸", "K粉", "迷药", "迷幻药", "听话水", "催情", "春药", "吸毒工具"]

[[rules]]
category = "prohibited"
label = "危险品"
words = ["炸药", "雷管", "烟花爆竹"]

[[rules]]
category = "prohibited"
label = "色情低俗"
words = ["原味内裤", "原味袜", "原味丝袜"]

[[rules]]
category = "prohibited"
label = "证件、隐私、违法服务"
words = [
  "代办身份证", "身份证复印件", "假证", "办证", "代开发票", "假发票", "盗号",
  "翻墙", "科学上网", "震楼器", "破胎钉", "吃瓜资料", "上门报复",
]

# ---- 4. 虚拟商品 ----

[[rules]]
category = "virtual"
label = "网盘、共享账号"
words = [
  "百度网盘", "网盘链接", "网盘资源", "百度云", "迅雷链接", "磁力链接", "BT种子",
  "共享账号", "合租会员", "知网会员", "知网账号", "代练", "代充", "盗版",
]

# ---- 5. 医疗和功效 ----
# 不收"特效"（视频特效、游戏特效）、"治疗"（治疗仪是正常商品名）、"食品级"（食品级硅胶）、"增高"（内增高）

[[rules]]
category = "medical"
label = "疗效"
words = [
  "根治", "治愈", "包治", "药到病除", "立竿见影", "神效", "奇效", "无副作用", "疗效",
  "速效", "全效", "换肤", "去除皱纹", "瞬间祛斑", "彻底见效",
  "壮阳", "丰胸", "减肥药", "增高药",
]
suggest = "写成分、用法和自己用下来的感受，不写疗效"

# ---- 6. 极限词：不扫单字"最"，只扫词组 ----
# 不收"第一""唯一"（第一次用、唯一的缺点）、"绝对""保证""一定"单用、"100%"单用（100%棉）、"最大""最高"（规格）

[[rules]]
category = "absolute"
label = "最低价"
words = ["全网最低", "全国最低", "史上最低", "历史最低", "最低价"]
suggest = "比同类便宜"

[[rules]]
category = "absolute"
label = "完美"
words = ["完美"]
suggest = "成色很好，没有明显瑕疵"

[[rules]]
category = "absolute"
label = "顶级"
words = ["顶级", "顶尖"]
suggest = "高配"

[[rules]]
category = "absolute"
label = "正品承诺"
words = ["百分百正品", "100%正品", "保证正品", "绝对正品"]
suggest = "在 XX 买的，有小票"

[[rules]]
category = "absolute"
label = "第一"
words = ["全网第一", "销量第一", "排名第一", "行业第一", "全国第一", "世界第一", "第一品牌"]
suggest = "热门款"

[[rules]]
category = "absolute"
label = "NO.1"
pattern = '(?<![a-z0-9])(?:no\s?\.?\s?1|top\s?1)(?![0-9])'
suggest = "热门款"

[[rules]]
category = "absolute"
label = "最"
words = ["最好", "最佳", "最优", "最强", "最便宜", "最先进", "最流行", "最火", "最牛", "最高级"]
exclude = [
  "最好是", "最好自提", "最好当面", "最好面交", "最好同城", "最好别", "最好不要", "最好能", "最好先",
]
suggest = "换成具体的说法：成色、参数、在哪买的"

[[rules]]
category = "absolute"
label = "顶级用语"
words = [
  "极品", "极致", "绝佳", "无敌", "王牌", "王者", "独家", "独一无二", "全网唯一",
  "全网首发", "全网最火", "国家级", "央视推荐", "人民日报推荐", "行业领袖",
  "百分百", "永不", "爆款",
]
exclude = ["王者荣耀", "极品飞车"]
suggest = "换成具体的说法：成色、参数、在哪买的"

# ---- 7. 其他平台的名字 ----

[[rules]]
category = "platform"
label = "平台名"
words = ["淘宝", "天猫", "拼多多", "PDD", "拼单", "百亿补贴", "京东", "抖音", "快手", "小红书", "官方旗舰店"]
exclude = ["京东方", "快手菜"]
suggest = "写成「网上买的」，不写平台名、店铺名"

[[rules]]
category = "platform"
label = "1688"
# 价格（1688 元）不算
pattern = '(?<![\d.¥])1688(?![\d.])(?!\s*[元块])'
suggest = "写成「网上买的」，不写平台名、店铺名"

[[rules]]
category = "platform"
label = "口令"
level = "strong"
basis = "official"
words = ["淘口令", "复制口令", "打开淘宝", "打开拼多多", "打开抖音"]
suggest = "删掉，口令、链接算引导站外交易"

# ---- 8. 促销和交易方式（定金、转账算在第 1 类） ----

[[rules]]
category = "promotion"
label = "好评返现"
basis = "law"
# 《网络反不正当竞争暂行规定》2024-09-01 起禁止用现金、红包诱导好评
words = ["好评返现", "晒图返现", "好评有礼", "刷单"]
suggest = "删掉"

[[rules]]
category = "promotion"
label = "买赠、运费险"
words = ["运费险", "买二送一", "买一送一"]

[[rules]]
category = "promotion"
label = "清仓用语"
basis = "opensource"
words = ["亏本", "清仓", "跳楼价", "白菜价"]

# ---- 9. 经营性表述：只告知，不给替换建议 ----

[[rules]]
category = "business"
label = "经营性表述"
words = [
  "一手货源", "厂家直销", "工厂直发", "批发", "招代理", "代理", "一件代发",
  "七天无理由", "七日无理由", "7天无理由", "售后保障", "实体店", "本店", "现货充足", "量大从优",
]
exclude = ["实体店买的", "实体店购买", "实体店入手"]
