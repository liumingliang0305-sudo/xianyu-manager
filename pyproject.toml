[project]
name = "xianyu-manager"
version = "0.1.0"
description = "闲鱼管理系统：xianyu_core 底座 + 自研业务层"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "fastapi>=0.162.0",
  "httpx>=0.27",
  "msgpack>=1.2.4",
  "psycopg[binary]>=3.2",
  "pyjwt>=2.10",
  "qrcode>=7.4",
  "sqlalchemy>=2.0",
  "uvicorn>=0.54.0",
  "websockets>=17.4",
]

[project.scripts]
xym = "app.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xianyu_core", "app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
