# Alembic 配置。连接串不写在这里：取环境变量 DATABASE_URL，没设时连本机 docker 里的库（app/db.py）。
#
#   uv run alembic upgrade head                            把库升到最新
#   uv run alembic revision --autogenerate -m "说明"        改了 app/schema.py 以后生成迁移
#   uv run alembic downgrade -1                            退一步

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# 迁移文件按日期排
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
